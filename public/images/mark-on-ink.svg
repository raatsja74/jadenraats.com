<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"
  role="img" aria-label="Jaden Raats logo mark — geometric six-arm asterisk on ink">
  <!-- Inverse variant: cream arms on the ink panel. Used for favicon, Apple
       touch icon and the share image. Geometry mirrors src/components/Mark.tsx -->
  <rect width="48" height="48" fill="#0A0A09" />
  <g stroke="#F2EFE6" stroke-width="5" stroke-linecap="square">
    <line x1="24" y1="4" x2="24" y2="44" />
    <line x1="41.32" y1="14" x2="6.68" y2="34" />
    <line x1="6.68" y1="14" x2="41.32" y2="34" />
  </g>
</svg>
